# Integración continua del framework (issue #14).
# Corre en cada PR y en cada push a main. Un job por contenedor.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detector:
    name: detector · pruebas e instalación
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: detector/pyproject.toml
      - name: Instalar (editable, con dependencias de desarrollo)
        run: pip install -e ".[dev]"
      - name: Pruebas unitarias
        run: pytest
      - name: Instalación no editable (la del contenedor) arranca con su catálogo
        run: |
          python -m venv /tmp/vdet
          /tmp/vdet/bin/pip install --quiet .
          cd /tmp && /tmp/vdet/bin/python -c "from detector.api import app; print('OK', app.title)"

  senuelo:
    name: senuelo · pruebas e instalación
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: senuelo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: senuelo/pyproject.toml
      - name: Instalar (editable, con dependencias de desarrollo)
        run: pip install -e ".[dev]"
      - name: Pruebas unitarias
        run: pytest
      - name: Instalación no editable (la del contenedor) importa el paquete
        run: |
          python -m venv /tmp/vsen
          /tmp/vsen/bin/pip install --quiet .
          cd /tmp && /tmp/vsen/bin/python -c "from senuelo.api import app; print('OK', app.title)"

  registro:
    name: registro · pruebas contra PostgreSQL
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: registro
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: umbra
          POSTGRES_PASSWORD: umbra_dev
          POSTGRES_DB: umbra_registro
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U umbra -d umbra_registro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      UMBRA_REGISTRO_DSN: postgresql://umbra:umbra_dev@127.0.0.1:5433/umbra_registro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: registro/pyproject.toml
      - name: Instalar
        run: pip install -e ".[dev]"
      # Si la base no responde, este paso falla. Así las pruebas de
      # integración nunca se "omiten" en silencio dentro del CI.
      - name: Aplicar esquema
        run: python -m registro.cli esquema
      - name: Pruebas de integración
        run: pytest -rs
      - name: Informe de demostración
        run: python -m registro.cli demo

  compose:
    name: infra · docker compose válido y detector en pie
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validar infra/docker-compose.yml
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Levantar esqueleto y esperar salud
        run: docker compose -f infra/docker-compose.yml up -d --build --wait --wait-timeout 180
      - name: Detector responde y detecta
        run: |
          curl -fsS http://127.0.0.1:8001/salud
          curl -fsS -X POST http://127.0.0.1:8001/analizar \
            -H 'content-type: application/json' \
            -d '{"origen":"ci","ruta":"/diagnostico/ping","parametro":"host","valor":"127.0.0.1;id"}' \
            | python3 -c "import json,sys; v=json.load(sys.stdin); assert v['es_ataque'] is True, v; print('veredicto OK')"
      - name: Esquema aplicado en la base del esqueleto
        run: docker compose -f infra/docker-compose.yml exec -T postgres psql -U umbra -d umbra_registro -c '\dt'
      - name: Bajar
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
