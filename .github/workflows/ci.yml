# Integración continua del framework (issues #14, #22 y #13).
# Corre en cada PR y en cada push a main.
# Verifica contrato, complementos, servicios, registro e infraestructura.
# Los paquetes locales se instalan en una sola invocación de pip con rutas
# locales: umbra-contrato no existe en PyPI (ADR-002, decisión 9). Cada carpeta
# de complementos/ debe ser un paquete; una carpeta inválida hace fallar pip.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contrato:
    name: contrato · pruebas y empaquetado
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contrato
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contrato/pyproject.toml
      - name: Instalar contrato
        run: pip install -e ".[dev]"
      - name: Pruebas del contrato
        run: pytest
      - name: Verificar instalación no editable
        run: |
          python -m venv /tmp/vcontrato
          /tmp/vcontrato/bin/pip install --quiet .
          /tmp/vcontrato/bin/pip check
          cd /tmp
          /tmp/vcontrato/bin/python -c "import contrato; print('Contrato importado correctamente')"

  complementos:
    name: complementos · pruebas y descubrimiento
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            contrato/pyproject.toml
            complementos/*/pyproject.toml
      - name: Instalar contrato y complementos (una sola invocación)
        run: |
          set -euo pipefail
          shopt -s nullglob
          directorios=(complementos/*/)
          (( ${#directorios[@]} )) || { echo "complementos/ no contiene ningún complemento" >&2; exit 1; }
          args=(-e "./contrato[dev]")
          for d in "${directorios[@]}"; do args+=(-e "./${d%/}"); done
          pip install "${args[@]}"
          pip check
      - name: Pruebas de cada complemento
        run: |
          set -euo pipefail
          for d in complementos/*/; do
            echo "::group::${d%/}"
            (cd "$d" && pytest)
            echo "::endgroup::"
          done
      - name: Instalación no editable descubre y carga cada complemento con sus datos
        run: |
          set -euo pipefail
          args=(./contrato)
          for d in complementos/*/; do args+=("./${d%/}"); done
          python -m venv /tmp/vcom
          /tmp/vcom/bin/pip install --quiet "${args[@]}"
          /tmp/vcom/bin/pip check
          cd /tmp
          /tmp/vcom/bin/python - <<'PY'
          from contrato.cargador import cargar, listar

          instalados = listar()
          assert instalados, "No se descubrió ningún complemento"
          for instalado in instalados:
              complemento = cargar(instalado.nombre)
              print("OK", instalado.nombre, instalado.paquete, instalado.version, complemento.cwe)
          PY

  detector:
    name: detector · pruebas e instalación
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: detector
    env:
      UMBRA_COMPLEMENTO: cwe78
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            contrato/pyproject.toml
            complementos/*/pyproject.toml
            detector/pyproject.toml
      - name: Instalar contrato, complementos y detector
        run: |
          set -euo pipefail
          shopt -s nullglob
          directorios=(../complementos/*/)
          (( ${#directorios[@]} )) || { echo "complementos/ no contiene ningún complemento" >&2; exit 1; }
          args=(-e ../contrato)
          for d in "${directorios[@]}"; do args+=(-e "${d%/}"); done
          pip install "${args[@]}" -e ".[dev]"
          pip check
      - name: Pruebas unitarias
        run: pytest
      - name: Instalación no editable y arranque de aplicación
        run: |
          set -euo pipefail
          args=(../contrato)
          for d in ../complementos/*/; do args+=("${d%/}"); done
          python -m venv /tmp/vdet
          /tmp/vdet/bin/pip install --quiet "${args[@]}" .
          /tmp/vdet/bin/pip check
          cd /tmp
          /tmp/vdet/bin/python -c "from detector.api import crear_app; app = crear_app(); print('OK', app.title)"

  senuelo:
    name: senuelo · pruebas e instalación
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: senuelo
    env:
      UMBRA_COMPLEMENTO: cwe78
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            contrato/pyproject.toml
            complementos/*/pyproject.toml
            senuelo/pyproject.toml
      - name: Instalar contrato, complementos y señuelo
        run: |
          set -euo pipefail
          shopt -s nullglob
          directorios=(../complementos/*/)
          (( ${#directorios[@]} )) || { echo "complementos/ no contiene ningún complemento" >&2; exit 1; }
          args=(-e ../contrato)
          for d in "${directorios[@]}"; do args+=(-e "${d%/}"); done
          pip install "${args[@]}" -e ".[dev]"
          pip check
      - name: Pruebas unitarias
        run: pytest
      - name: Instalación no editable y arranque de aplicación
        run: |
          set -euo pipefail
          args=(../contrato)
          for d in ../complementos/*/; do args+=("${d%/}"); done
          python -m venv /tmp/vsen
          /tmp/vsen/bin/pip install --quiet "${args[@]}" .
          /tmp/vsen/bin/pip check
          cd /tmp
          /tmp/vsen/bin/python -c "from senuelo.api import crear_app; app = crear_app(); print('OK', app.title)"

  registro:
    name: registro · pruebas contra PostgreSQL
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: registro
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: umbra
          POSTGRES_PASSWORD: umbra_dev
          POSTGRES_DB: umbra_registro
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U umbra -d umbra_registro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      UMBRA_REGISTRO_DSN: postgresql://umbra:umbra_dev@127.0.0.1:5433/umbra_registro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: registro/pyproject.toml
      - name: Instalar
        run: pip install -e ".[dev]"
      # Si la base no responde, este paso falla. Así las pruebas de
      # integración nunca se "omiten" en silencio dentro del CI.
      - name: Aplicar esquema
        run: python -m registro.cli esquema
      - name: Pruebas de integración
        run: pytest -rs
      - name: Informe de demostración
        run: python -m registro.cli demo

  compose:
    # El nombre se conserva: es un check obligatorio del ruleset de main.
    name: infra · docker compose válido y detector en pie
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validar infra/docker-compose.yml
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Levantar esqueleto y esperar salud
        run: docker compose -f infra/docker-compose.yml up -d --build --wait --wait-timeout 180
      - name: Detector responde y detecta
        run: |
          curl -fsS http://127.0.0.1:8001/salud
          curl -fsS -X POST http://127.0.0.1:8001/analizar \
            -H 'content-type: application/json' \
            -d '{"origen":"ci","ruta":"/diagnostico/ping","parametro":"host","valor":"127.0.0.1;id"}' \
            | python3 -c "import json,sys; v=json.load(sys.stdin); assert v['es_ataque'] is True, v; assert v['complemento'] == 'cwe78', v; print('veredicto OK')"
      - name: Señuelo responde y descubre el complemento
        run: |
          curl -fsS http://127.0.0.1:8002/salud \
            | python3 -c "import json,sys; v=json.load(sys.stdin); assert v['estado'] == 'ok', v; assert v['complemento']['nombre'] == 'cwe78', v; print('señuelo OK')"
      - name: Esquema aplicado en la base del esqueleto
        run: docker compose -f infra/docker-compose.yml exec -T postgres psql -U umbra -d umbra_registro -c '\dt'
      - name: Bajar
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
