# Integración continua del framework (issues #14, #22, #13 y #15).
# El job compose ejecuta las pruebas de integración de /interceptar contra el
# esqueleto real con un doble de prueba de Ollama (infra/ci/).
# Corre en cada PR y en cada push a main.
# Verifica contrato, complementos, servicios, registro e infraestructura.
# Los paquetes locales se instalan en una sola invocación de pip con rutas
# locales: umbra-contrato no existe en PyPI (ADR-002, decisión 9). Cada carpeta
# de complementos/ debe ser un paquete; una carpeta inválida hace fallar pip.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contrato:
    name: contrato · pruebas y empaquetado
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contrato
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contrato/pyproject.toml
      - name: Instalar contrato
        run: pip install -e ".[dev]"
      - name: Pruebas del contrato
        run: pytest
      - name: Verificar instalación no editable
        run: |
          python -m venv /tmp/vcontrato
          /tmp/vcontrato/bin/pip install --quiet .
          /tmp/vcontrato/bin/pip check
          cd /tmp
          /tmp/vcontrato/bin/python -c "import contrato; print('Contrato importado correctamente')"

  complementos:
    name: complementos · pruebas y descubrimiento
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            contrato/pyproject.toml
            complementos/*/pyproject.toml
      - name: Instalar contrato y complementos (una sola invocación)
        run: |
          set -euo pipefail
          shopt -s nullglob
          directorios=(complementos/*/)
          (( ${#directorios[@]} )) || { echo "complementos/ no contiene ningún complemento" >&2; exit 1; }
          args=(-e "./contrato[dev]")
          for d in "${directorios[@]}"; do args+=(-e "./${d%/}"); done
          pip install "${args[@]}"
          pip check
      - name: Pruebas de cada complemento
        run: |
          set -euo pipefail
          for d in complementos/*/; do
            echo "::group::${d%/}"
            (cd "$d" && pytest)
            echo "::endgroup::"
          done
      - name: Instalación no editable descubre y carga cada complemento con sus datos
        run: |
          set -euo pipefail
          args=(./contrato)
          for d in complementos/*/; do args+=("./${d%/}"); done
          python -m venv /tmp/vcom
          /tmp/vcom/bin/pip install --quiet "${args[@]}"
          /tmp/vcom/bin/pip check
          cd /tmp
          /tmp/vcom/bin/python - <<'PY'
          from contrato.cargador import cargar, listar

          instalados = listar()
          assert instalados, "No se descubrió ningún complemento"
          for instalado in instalados:
              complemento = cargar(instalado.nombre)
              print("OK", instalado.nombre, instalado.paquete, instalado.version, complemento.cwe)
          PY

  detector:
    name: detector · pruebas e instalación
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: detector
    env:
      UMBRA_COMPLEMENTO: cwe78
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            contrato/pyproject.toml
            complementos/*/pyproject.toml
            registro/pyproject.toml
            detector/pyproject.toml
      - name: Instalar contrato, complementos, registro y detector
        run: |
          set -euo pipefail
          shopt -s nullglob
          directorios=(../complementos/*/)
          (( ${#directorios[@]} )) || { echo "complementos/ no contiene ningún complemento" >&2; exit 1; }
          args=(-e ../contrato -e ../registro)
          for d in "${directorios[@]}"; do args+=(-e "${d%/}"); done
          pip install "${args[@]}" -e ".[dev]"
          pip check
      - name: Pruebas unitarias
        run: pytest
      - name: Instalación no editable y arranque de aplicación
        run: |
          set -euo pipefail
          args=(../contrato ../registro)
          for d in ../complementos/*/; do args+=("${d%/}"); done
          python -m venv /tmp/vdet
          /tmp/vdet/bin/pip install --quiet "${args[@]}" .
          /tmp/vdet/bin/pip check
          cd /tmp
          /tmp/vdet/bin/python -c "from detector.api import crear_app; app = crear_app(); print('OK', app.title)"

  senuelo:
    name: senuelo · pruebas e instalación
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: senuelo
    env:
      UMBRA_COMPLEMENTO: cwe78
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            contrato/pyproject.toml
            complementos/*/pyproject.toml
            senuelo/pyproject.toml
      - name: Instalar contrato, complementos y señuelo
        run: |
          set -euo pipefail
          shopt -s nullglob
          directorios=(../complementos/*/)
          (( ${#directorios[@]} )) || { echo "complementos/ no contiene ningún complemento" >&2; exit 1; }
          args=(-e ../contrato)
          for d in "${directorios[@]}"; do args+=(-e "${d%/}"); done
          pip install "${args[@]}" -e ".[dev]"
          pip check
      - name: Pruebas unitarias
        run: pytest
      - name: Instalación no editable y arranque de aplicación
        run: |
          set -euo pipefail
          args=(../contrato)
          for d in ../complementos/*/; do args+=("${d%/}"); done
          python -m venv /tmp/vsen
          /tmp/vsen/bin/pip install --quiet "${args[@]}" .
          /tmp/vsen/bin/pip check
          cd /tmp
          /tmp/vsen/bin/python -c "from senuelo.api import crear_app; app = crear_app(); print('OK', app.title)"

  registro:
    name: registro · pruebas contra PostgreSQL
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: registro
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: umbra
          POSTGRES_PASSWORD: umbra_dev
          POSTGRES_DB: umbra_registro
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U umbra -d umbra_registro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      UMBRA_REGISTRO_DSN: postgresql://umbra:umbra_dev@127.0.0.1:5433/umbra_registro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: registro/pyproject.toml
      - name: Instalar
        run: pip install -e ".[dev]"
      # Si la base no responde, este paso falla. Así las pruebas de
      # integración nunca se "omiten" en silencio dentro del CI.
      - name: Aplicar esquema
        run: python -m registro.cli esquema
      - name: Pruebas de integración
        run: pytest -rs
      - name: Informe de demostración
        run: python -m registro.cli demo

  compose:
    # El nombre se conserva: es un check obligatorio del ruleset de main.
    name: infra · docker compose válido y detector en pie
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/pruebas/requirements.txt
      - name: Dependencias de las pruebas de integración
        run: python -m pip install -r infra/pruebas/requirements.txt
      # Doble de prueba de Ollama (umbra#15, PR 3b): en el anfitrión, fuera de
      # Compose, igual que Ollama en el laboratorio. Verifica el flujo, no la
      # credibilidad del señuelo (infra/ci/README.md).
      - name: Pruebas del doble de prueba de Ollama
        run: python -m pytest infra/ci -q -p no:cacheprovider
      - name: Arrancar el doble de prueba de Ollama en el anfitrión
        run: |
          nohup python infra/ci/ollama_doble.py --host 0.0.0.0 --puerto 11434 > /tmp/ollama_doble.log 2>&1 &
          echo $! > /tmp/ollama_doble.pid
          for i in $(seq 1 30); do
            v=$(curl -fsS --max-time 2 http://127.0.0.1:11434/api/version) && {
              echo "$v"
              # Debe ser el doble y no otro proceso en el puerto.
              echo "$v" | grep -q 'doble de prueba' && exit 0
              echo "En el puerto 11434 responde otro servidor" >&2; exit 1
            }
            sleep 1
          done
          echo "El doble de Ollama no respondió en 30 s" >&2; cat /tmp/ollama_doble.log; exit 1
      - name: El doble es alcanzable desde un contenedor, como lo usa el señuelo
        run: |
          docker run --rm --add-host=host.docker.internal:host-gateway curlimages/curl:8.11.1 \
            -fsS --max-time 5 http://host.docker.internal:11434/api/version | tee /dev/stderr | grep -q 'doble de prueba'
      - name: Validar infra/docker-compose.yml
        run: docker compose -f infra/docker-compose.yml config --quiet
      - name: Levantar esqueleto y esperar salud
        run: docker compose -f infra/docker-compose.yml up -d --build --wait --wait-timeout 180
      - name: Detector responde y detecta
        run: |
          curl -fsS http://127.0.0.1:8001/salud
          curl -fsS -X POST http://127.0.0.1:8001/analizar \
            -H 'content-type: application/json' \
            -d '{"origen":"ci","ruta":"/diagnostico/ping","parametro":"host","valor":"127.0.0.1;id"}' \
            | python3 -c "import json,sys; v=json.load(sys.stdin); assert v['es_ataque'] is True, v; assert v['complemento'] == 'cwe78', v; print('veredicto OK')"
      - name: Señuelo responde y descubre el complemento
        run: |
          curl -fsS http://127.0.0.1:8002/salud \
            | python3 -c "import json,sys; v=json.load(sys.stdin); assert v['estado'] == 'ok', v; assert v['complemento']['nombre'] == 'cwe78', v; print('señuelo OK')"
      - name: Red arya-lab creada y solo el detector unido (ADR-003)
        run: |
          miembros=$(docker network inspect arya-lab --format '{{range .Containers}}{{.Name}} {{end}}')
          echo "arya-lab: $miembros"
          echo "$miembros" | grep -q 'detector' || { echo "el detector no está en arya-lab"; exit 1; }
          for s in senuelo postgres; do
            if echo "$miembros" | grep -q "$s"; then echo "$s no debe estar en arya-lab"; exit 1; fi
          done
          echo "red OK"
      - name: Esquema aplicado en la base del esqueleto
        run: docker compose -f infra/docker-compose.yml exec -T postgres psql -U umbra -d umbra_registro -c '\dt'
      - name: Señuelo listo (calentamiento contra el doble)
        run: |
          for i in $(seq 1 24); do
            c=$(curl -s -o /tmp/listo.json -w '%{http_code}' http://127.0.0.1:8002/listo)
            [ "$c" = 200 ] && { cat /tmp/listo.json; echo; exit 0; }
            sleep 5
          done
          echo "El señuelo no quedó listo en 2 min: $c" >&2; cat /tmp/listo.json; exit 1
      - name: Pruebas de integración de /interceptar (las 7, incluidas las destructivas)
        run: python -m pytest infra/pruebas -v
      - name: La respuesta registrada vino del doble (no de otro servidor)
        run: |
          texto=$(docker compose -f infra/docker-compose.yml exec -T postgres psql -U umbra -d umbra_registro -At \
            -c "select detalle->>'respuesta' from eventos where tipo='respuesta_senuelo' order by id desc limit 1")
          echo "evento 4: $texto"
          [ "$texto" = "[doble de prueba de Ollama: respuesta fija del CI]" ]
      - name: Log del doble de Ollama y detención
        if: always()
        run: |
          cat /tmp/ollama_doble.log 2>/dev/null || true
          [ -f /tmp/ollama_doble.pid ] && kill "$(cat /tmp/ollama_doble.pid)" 2>/dev/null || true
      - name: Bajar
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
