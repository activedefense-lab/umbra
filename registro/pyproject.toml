[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "umbra-registro"
version = "0.1.0"
description = "Umbra · contenedor de registro forense (paso 6 del flujo)"
readme = "GUIA.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Noel Santiago Méndez Jaimes" },
  { name = "Nicole Camila Niño Ariza" },
]
dependencies = [
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
registro = ["../../sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
