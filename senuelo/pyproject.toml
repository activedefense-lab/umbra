[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "umbra-senuelo"
version = "0.1.0"
description = "Umbra · generador de respuestas simuladas mediante Ollama"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Nicole Camila Niño Ariza" },
  { name = "Noel Santiago Méndez Jaimes" },
]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "umbra-contrato",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
